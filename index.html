<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sesli Kitap</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #ffffff;
      --accent: #007aff;
      --muted: #8e8e93;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    header {
      padding-bottom: 12px;
      border-bottom: 1px solid #2c2c2e;
    }
    .file-input {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      color: var(--muted);
    }
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
      font-size: 17px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .active-sentence {
      background-color: rgba(0, 122, 255, 0.4);
      border-radius: 4px;
      padding: 2px 4px;
    }
    .controls {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    button {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background: #3a3a3c;
      color: var(--muted);
      cursor: not-allowed;
    }
    .status {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <input type="file" id="filePicker" class="file-input" accept=".pdf">
  <div class="status" id="bookTitle">Lütfen bir PDF seçin</div>
</header>

<main id="content">PDF seçildiğinde metin buraya aktarılacaktır.</main>

<div class="controls">
  <div class="status" id="progressStatus">Cümle: 0 / 0</div>
  <div class="btn-row">
    <button id="prevBtn" disabled>Önceki</button>
    <button id="playBtn" disabled>Başlat</button>
    <button id="nextBtn" disabled>Sonraki</button>
  </div>
</div>

<!-- Harici ses motoru için HTML5 Audio Oynatıcı -->
<audio id="audioPlayer" preload="auto"></audio>

<script>
  if (window['pdfjs-dist/build/pdf']) {
    window.pdfjsLib = window['pdfjs-dist/build/pdf'];
  }
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
  }

  let currentBookId = '';
  let sentences = [];
  let currentIndex = 0;
  let isPlaying = false;

  const audioPlayer = document.getElementById('audioPlayer');
  const filePicker = document.getElementById('filePicker');
  const contentEl = document.getElementById('content');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const bookTitleEl = document.getElementById('bookTitle');
  const progressStatusEl = document.getElementById('progressStatus');

  filePicker.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    stopAudio();
    currentBookId = file.name;
    bookTitleEl.innerText = file.name;
    contentEl.innerText = "PDF okunuyor, lütfen bekleyin...";

    try {
      const arrayBuffer = await file.arrayBuffer();
      const typedarray = new Uint8Array(arrayBuffer);
      const loadingTask = pdfjsLib.getDocument({ data: typedarray });
      const pdf = await loadingTask.promise;

      let extractedText = "";
      const totalPages = pdf.numPages;

      for (let i = 1; i <= totalPages; i++) {
        contentEl.innerText = `Sayfa işleniyor: ${i} / ${totalPages}...`;
        const page = await pdf.getPage(i);
