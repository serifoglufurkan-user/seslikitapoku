<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sesli Kitap</title>
  <!-- Kararlı ve bağımsız PDF.js sürümü -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #ffffff;
      --accent: #007aff;
      --muted: #8e8e93;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    header {
      padding-bottom: 12px;
      border-bottom: 1px solid #2c2c2e;
    }
    .file-input {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      color: var(--muted);
    }
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
      font-size: 17px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .active-sentence {
      background-color: rgba(0, 122, 255, 0.4);
      border-radius: 4px;
      padding: 2px 4px;
    }
    .controls {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    button {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background: #3a3a3c;
      color: var(--muted);
      cursor: not-allowed;
    }
    .status {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <input type="file" id="filePicker" class="file-input" accept=".pdf">
  <div class="status" id="bookTitle">Lütfen bir PDF seçin</div>
</header>

<main id="content">PDF seçildiğinde metin buraya aktarılacaktır.</main>

<div class="controls">
  <div class="status" id="progressStatus">Cümle: 0 / 0</div>
  <div class="btn-row">
    <button id="prevBtn" disabled>Önceki</button>
    <button id="playBtn" disabled>Başlat</button>
    <button id="nextBtn" disabled>Sonraki</button>
  </div>
</div>

<script>
  // Worker yükleme hatalarını önlemek için worker yolunu doğrudan kütüphaneden bağlayalım
  if (window['pdfjs-dist/build/pdf']) {
    window.pdfjsLib = window['pdfjs-dist/build/pdf'];
  }
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
  }

  let currentBookId = '';
  let sentences = [];
  let currentIndex = 0;
  let isPlaying = false;
  const synth = window.speechSynthesis;
  let utterance = null;

  const filePicker = document.getElementById('filePicker');
  const contentEl = document.getElementById('content');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const bookTitleEl = document.getElementById('bookTitle');
  const progressStatusEl = document.getElementById('progressStatus');

  filePicker.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    stopAudio();
    currentBookId = file.name;
    bookTitleEl.innerText = file.name;
    contentEl.innerText = "PDF okunuyor, lütfen bekleyin...";

    try {
      const arrayBuffer = await file.arrayBuffer();
      const typedarray = new Uint8Array(arrayBuffer);

      const loadingTask = pdfjsLib.getDocument({ data: typedarray });
      const pdf = await loadingTask.promise;

      let extractedText = "";
      const totalPages = pdf.numPages;

      for (let i = 1; i <= totalPages; i++) {
        contentEl.innerText = `Sayfa işleniyor: ${i} / ${totalPages}...`;
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(' ');
        extractedText += pageText + "\n";
      }

      if (!extractedText.trim()) {
        contentEl.innerText = "HATA: Bu PDF belgesinde okunabilir metin bulunamadı. Belge taranmış resimlerden (fotoğraflardan) oluşuyor olabilir.";
        return;
      }

      // Cümlelere bölme işlemi
      sentences = extractedText
        .replace(/([.?!])\s*(?=[A-ZĞÜŞİÖÇa-zğüşıöç0-9])/g, "$1|")
        .split("|")
        .map(s => s.trim())
        .filter(s => s.length > 2);

      if (sentences.length === 0) {
        contentEl.innerText = "Metin bulundu fakat cümleler ayrıştırılamadı.";
        return;
      }

      // Kaldığı yeri hafızadan al
      const savedIndex = localStorage.getItem('progress_' + currentBookId);
      currentIndex = savedIndex ? parseInt(savedIndex, 10) : 0;
      if (currentIndex >= sentences.length) currentIndex = 0;

      renderContent();
      updateUI();

    } catch (err) {
      console.error(err);
      contentEl.innerText = "PDF açılırken hata oluştu: " + err.message;
    }
  });

  function renderContent() {
    contentEl.innerHTML = '';
    const fragment = document.createDocumentFragment();
    sentences.forEach((sentence, idx) => {
      const span = document.createElement('span');
      span.id = `sent-${idx}`;
      span.innerText = sentence + ' ';
      fragment.appendChild(span);
    });
    contentEl.appendChild(fragment);
    highlightCurrent();
  }

  function highlightCurrent() {
    document.querySelectorAll('.active-sentence').forEach(el => el.classList.remove('active-sentence'));
    const currentEl = document.getElementById(`sent-${currentIndex}`);
    if (currentEl) {
      currentEl.classList.add('active-sentence');
      currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    progressStatusEl.innerText = `Cümle: ${currentIndex + 1} / ${sentences.length}`;
    localStorage.setItem('progress_' + currentBookId, currentIndex);
  }

  function updateUI() {
    const hasData = sentences.length > 0;
    playBtn.disabled = !hasData;
    prevBtn.disabled = !hasData;
    nextBtn.disabled = !hasData;
    playBtn.innerText = isPlaying ? "Durdur" : "Başlat";
  }

  function playCurrent() {
    if (currentIndex >= sentences.length) {
      stopAudio();
      return;
    }

    synth.cancel();
    utterance = new SpeechSynthesisUtterance(sentences[currentIndex]);
    utterance.lang = 'tr-TR';
    utterance.rate = 1.0;

    utterance.onend = () => {
      if (isPlaying) {
        currentIndex++;
        if (currentIndex < sentences.length) {
          highlightCurrent();
          playCurrent();
        } else {
          stopAudio();
        }
      }
    };

    utterance.onerror = () => {
      stopAudio();
    };

    highlightCurrent();
    synth.speak(utterance);
    isPlaying = true;
    updateUI();
  }

  function stopAudio() {
    synth.cancel();
    isPlaying = false;
    updateUI();
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) {
      stopAudio();
    } else {
      playCurrent();
    }
  });

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      highlightCurrent();
      if (isPlaying) playCurrent();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < sentences.length - 1) {
      currentIndex++;
      highlightCurrent();
      if (isPlaying) playCurrent();
    }
  });
</script>

</body>
</html>
